addr = "9f2b"
bank = 22
emit = true
entry_m = 1
entry_x = 1
note = "Descriptive label for $169F2B-$169F3D; conditionally clears $7F:FFA0-FFA7, WRAM stores only."

[[func]]
name = "CopyLevelBufferPointers"
addr = "a6ba"
bank = 13
emit = true
entry_m = 1
entry_x = 1
note = "Descriptive label for $0DA6BA-$0DA6CC; copies direct-page pointers and a WRAM buffer byte, with live store guards."


[[func]]
name = "UploadIndexedPalette80"
addr = "9585"
bank = 22
emit = true
entry_m = 1
entry_x = 1
note = "Descriptive label for $169585-$16959E; indexed palette-port byte loop with instruction-start event timing and live address guards."

[[func]]
name = "UploadIndexedPalette30"
addr = "efb2"
bank = 19
emit = true
entry_m = 1
entry_x = 1
note = "Descriptive label for $13EFB2-$13EFCE; palette-port byte loop and live final index reload, with instruction-start event timing."


[[func]]
name = "SubtractIndexedCoordinateWord"
addr = "f1c2"
bank = 19
emit = true
entry_m = 1
entry_x = 1
note = "Descriptive label for $13F1C2-$13F1D4; assembles an indexed word, subtracts DB:$001A+Y and stores DB:Y, returning M1. Word bank endpoints retain interpreter fallback."


[[func]]
name = "BuildCoordinatePair"
addr = "f1a7"
bank = 19
emit = true
entry_m = 1
entry_x = 1
note = "Descriptive label for $13F1A7-$13F1D4; calls the qualified coordinate leaf, updates the direct-page pair with borrow, then executes the coordinate leaf inline."

[[func]]
name = "BuildIndexedSpriteEntries"
addr = "f06f"
bank = 19
emit = true
entry_m = 1
entry_x = 1
note = "Descriptive label for $13F06F-$13F0C4; calls the qualified coordinate pair, scans 32 indexed candidates and writes visible entries plus size bytes."

[[func]]
name = "AppendIndexedSpriteEntries"
addr = "f13d"
bank = 19
emit = true
entry_m = 1
entry_x = 1
note = "Descriptive label for $13F13D-$13F192; preserves the incoming Y around the qualified coordinate call and scans 26 indexed candidates, appending visible sprite entries."

[[func]]
name = "SubtractIndexedCoordinateWordBank15"
addr = "a032"
bank = 21
emit = true
entry_m = 1
entry_x = 1
