# Progressive symbol map for Brutal Mario Demo 1-1.
#
# Each [[func]] names an address the analyzer should treat as a function.
# Set emit = true to promote one into ahead-of-time codegen; leave it false
# to keep it interpreted. tools/regen.sh syncs labels and tier choices into
# each recomp/bankNN.cfg; only emit=true adds a func/funcs.h declaration.
# Do not hand-edit the generated blocks in the bank configs.

[[func]]
name = "I_RESET"
addr = "8000"
bank = 0
emit = false
note = "Emulation RESET vector ($FFFC)"

[[func]]
name = "I_NMI"
addr = "816a"
bank = 0
emit = false
note = "Native NMI vector ($FFEA)"

[[func]]
name = "CopyEightWordsAndEightBytes"
addr = "80b9"
bank = 4
emit = true
entry_m = 0
entry_x = 0
note = "Verified ROM leaf $0480B9-$0480DF; two eight-element copy loops, RTS."

[[func]]
name = "ReadByteAdvanceLoRomPointer"
addr = "b983"
bank = 0
emit = false
entry_m = 1
entry_x = 0
note = "Deferred: $00B983-$00B991 is a verified leaf, but current block timing shifts boot mode $02 by a frame. Keep interpreted."
